name: Case Core Frontend CI

on:
  pull_request:
    paths:
      - 'apps/web/**'
      - 'architecture/**'
      - 'ux/**'
      - 'design/**'
  push:
    branches:
      - frontend/case-core-v0.1
    paths:
      - 'apps/web/**'

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm test
      - run: npm run build
