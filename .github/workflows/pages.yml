name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: rnr-pages-site
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          path: app

      - name: Checkout Pages content store
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: pages-store
          fetch-depth: 0

      - name: Sync production files into Pages store
        shell: bash
        run: |
          cp app/index.html pages-store/index.html
          if [ -f app/workflow-explorer.html ]; then
            cp app/workflow-explorer.html pages-store/workflow-explorer.html
          fi
          touch pages-store/.nojekyll

      - name: Persist production content
        working-directory: pages-store
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html workflow-explorer.html .nojekyll 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No production content changes to commit."
          else
            git commit -m "publish: main @ ${GITHUB_SHA::7}"
            git push origin gh-pages
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload combined site
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages-store

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
