name: Agentic issue dispatcher

on:
  issues:
    types:
      - labeled
      - closed
      - reopened
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number to evaluate and dispatch
        required: true
        type: string

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: agent-dispatch-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      PROJECT_GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
      PROJECT_OWNER: '@me'
      PROJECT_NUMBER: '10'

    steps:
      - name: Checkout orchestration control plane
        uses: actions/checkout@v4

      - name: Require orchestration tokens
        shell: bash
        run: |
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "GITHUB_TOKEN is required for repository orchestration." >&2
            exit 1
          fi
          if [ -z "${PROJECT_GH_TOKEN:-}" ]; then
            echo "PROJECT_TOKEN is required for Projects v2 orchestration state." >&2
            exit 1
          fi

      - name: Dispatch manual request
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          chmod +x .github/scripts/project-status.sh .github/scripts/dispatch-issue.sh
          .github/scripts/dispatch-issue.sh "${{ inputs.issue_number }}"

      - name: Handle workflow label
        if: github.event_name == 'issues' && github.event.action == 'labeled' && startsWith(github.event.label.name, 'workflow:')
        shell: bash
        run: |
          chmod +x .github/scripts/project-status.sh .github/scripts/dispatch-issue.sh
          .github/scripts/dispatch-issue.sh "${{ github.event.issue.number }}"

      - name: Handle reopened issue
        if: github.event_name == 'issues' && github.event.action == 'reopened'
        shell: bash
        run: |
          chmod +x .github/scripts/project-status.sh .github/scripts/dispatch-issue.sh
          .github/scripts/project-status.sh "${{ github.event.issue.number }}" "Backlog"
          .github/scripts/dispatch-issue.sh "${{ github.event.issue.number }}"

      - name: Mark closed issue done and release dependents
        if: github.event_name == 'issues' && github.event.action == 'closed'
        shell: bash
        run: |
          chmod +x .github/scripts/project-status.sh .github/scripts/dispatch-issue.sh
          .github/scripts/project-status.sh "${{ github.event.issue.number }}" "Done"

          # Re-evaluate only direct dependents of the issue that just closed.
          # This keeps release work proportional to the graph edge that changed
          # and avoids burning GitHub API rate limit across unrelated backlog items.
          closed_issue="${{ github.event.issue.number }}"

          jq -r --argjson closed "$closed_issue" '
            to_entries[]
            | select(.value | index($closed))
            | .key
          ' .github/agentic/case-core-dependencies.json |
          while read -r issue_number; do
            [ -z "$issue_number" ] && continue
            .github/scripts/dispatch-issue.sh "$issue_number"
          done
