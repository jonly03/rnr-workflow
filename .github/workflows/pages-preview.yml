name: Request draft Pages preview

on:
  push:
    branches:
      - 'workflow/**'
      - 'feature/**'
      - 'fix/**'
      - 'chore/**'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  request-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Compute preview slug
        id: slug
        shell: bash
        run: |
          slug="${GITHUB_REF_NAME//\//-}"
          slug="$(printf '%s' "$slug" | tr '[:upper:]' '[:lower:]' | tr -cd 'a-z0-9._-')"
          echo "slug=$slug" >> "$GITHUB_OUTPUT"

      - name: Dispatch preview publisher on main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh workflow run pages-preview-publish.yml             --repo "${GITHUB_REPOSITORY}"             --ref main             -f source_ref="${GITHUB_REF_NAME}"             -f preview_slug="${{ steps.slug.outputs.slug }}"
