name: Deploy draft Pages preview

on:
  push:
    branches:
      - 'workflow/**'
      - 'feature/**'
      - 'fix/**'
      - 'chore/**'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: rnr-pages-site
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Checkout draft branch
        uses: actions/checkout@v4
        with:
          path: draft

      - name: Checkout Pages content store
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: pages-store
          fetch-depth: 0

      - name: Compute preview slug
        id: slug
        shell: bash
        run: |
          slug="${GITHUB_REF_NAME//\//-}"
          slug="$(printf '%s' "$slug" | tr '[:upper:]' '[:lower:]' | tr -cd 'a-z0-9._-')"
          echo "slug=$slug" >> "$GITHUB_OUTPUT"

      - name: Build preview
        shell: bash
        run: |
          test -f draft/index.html
          preview_dir="pages-store/site/previews/${{ steps.slug.outputs.slug }}"
          rm -rf "$preview_dir"
          mkdir -p "$preview_dir"
          cp draft/index.html "$preview_dir/index.html"

      - name: Persist preview content
        working-directory: pages-store
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site
          if git diff --cached --quiet; then
            echo "No preview content changes to commit."
          else
            git commit -m "preview: ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}"
            git push origin gh-pages
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload combined Pages site
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages-store/site

      - name: Deploy combined Pages site
        id: deploy
        uses: actions/deploy-pages@v4

      - name: Print preview URL
        shell: bash
        run: |
          echo "Preview: https://jonly03.github.io/rnr-workflow/previews/${{ steps.slug.outputs.slug }}/"
