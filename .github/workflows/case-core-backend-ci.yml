name: Case Core Backend CI

on:
  pull_request:
    paths:
      - 'apps/api/**'
      - 'architecture/**'
  push:
    branches:
      - backend/case-core-v0.1
    paths:
      - 'apps/api/**'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm test
