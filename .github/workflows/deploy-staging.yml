name: Deploy Case Core Staging

on:
  push:
    branches:
      - staging
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: case-core-staging
  cancel-in-progress: true

jobs:
  deploy-and-smoke:
    runs-on: ubuntu-latest
    environment: staging
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      API_PROJECT_ID: ${{ vars.VERCEL_API_PROJECT_ID }}
      WEB_PROJECT_ID: ${{ vars.VERCEL_WEB_PROJECT_ID }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
      STAFF_ADMIN_EMAIL: ${{ secrets.STAFF_ADMIN_EMAIL }}
      STAFF_ADMIN_PASSWORD: ${{ secrets.STAFF_ADMIN_PASSWORD }}
      # MyGrant live-mode config. The secrets exist on staging; the provider
      # selectors are repo vars so Nelly can flip staging to live without a
      # code change. Both default to "mock" — forwarding empty values is safe.
      MYGRANT_USERNAME: ${{ secrets.MYGRANT_USERNAME }}
      MYGRANT_PASSWORD: ${{ secrets.MYGRANT_PASSWORD }}
      GLASS_CATALOG_PROVIDER: ${{ vars.GLASS_CATALOG_PROVIDER }}
      SOURCING_PROVIDER: ${{ vars.SOURCING_PROVIDER }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Require deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in VERCEL_TOKEN VERCEL_ORG_ID API_PROJECT_ID WEB_PROJECT_ID DATABASE_URL VERCEL_AUTOMATION_BYPASS_SECRET AUTH_SECRET STAFF_ADMIN_EMAIL STAFF_ADMIN_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "Missing staging deployment value: $name" >&2
              exit 1
            fi
          done

      - name: Install deployment tooling
        run: npm install --global vercel@latest

      - name: Migrate staging database
        working-directory: apps/api
        env:
          DATABASE_SSL_MODE: require
        run: |
          npm install
          npm run migrate

      - name: Deploy staging API
        id: api
        working-directory: apps/api
        env:
          VERCEL_PROJECT_ID: ${{ env.API_PROJECT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"
          api_url="$(vercel deploy --yes --token="$VERCEL_TOKEN" --env DATABASE_URL="$DATABASE_URL" --env PG_POOL_MAX=3 --env AUTH_SECRET="$AUTH_SECRET" --env STAFF_ADMIN_EMAIL="$STAFF_ADMIN_EMAIL" --env STAFF_ADMIN_PASSWORD="$STAFF_ADMIN_PASSWORD" --env MYGRANT_USERNAME="$MYGRANT_USERNAME" --env MYGRANT_PASSWORD="$MYGRANT_PASSWORD" --env GLASS_CATALOG_PROVIDER="${GLASS_CATALOG_PROVIDER:-mock}" --env SOURCING_PROVIDER="${SOURCING_PROVIDER:-mock}" | tail -n1)"
          echo "url=$api_url" >> "$GITHUB_OUTPUT"
          echo "API: $api_url" >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy staging web
        id: web
        working-directory: apps/web
        env:
          VERCEL_PROJECT_ID: ${{ env.WEB_PROJECT_ID }}
          API_URL: ${{ steps.api.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"
          web_url="$(vercel deploy --yes --token="$VERCEL_TOKEN" \
            --env UPSTREAM_API_URL="$API_URL" \
            --env VERCEL_AUTOMATION_BYPASS_SECRET="$VERCEL_AUTOMATION_BYPASS_SECRET" \
            --build-env VITE_API_BASE_URL="/api/v1" | tail -n1)"
          echo "url=$web_url" >> "$GITHUB_OUTPUT"
          echo "Web: $web_url" >> "$GITHUB_STEP_SUMMARY"

      - name: Alias stable staging URLs
        working-directory: apps/web
        env:
          VERCEL_PROJECT_ID: ${{ env.WEB_PROJECT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          # Stable aliases so there's one permanent staging URL to test.
          # Re-assigning an existing alias just moves it to the new deployment.
          vercel alias "${{ steps.web.outputs.url }}" rnr-case-staging-zero-to100-edu.vercel.app --token="$VERCEL_TOKEN"
          echo "Stable web: https://rnr-case-staging-zero-to100-edu.vercel.app" >> "$GITHUB_STEP_SUMMARY"

      - name: Live API health check
        env:
          API_URL: ${{ steps.api.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl --show-error --silent \
            -o /tmp/staging-health.json \
            -w '%{http_code}' \
            -H "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET" \
            "$API_URL/health")"
          echo "Health status: $status"
          cat /tmp/staging-health.json || true
          if [ "$status" != "200" ]; then
            echo "API health failed; fetching recent Vercel runtime logs..." >&2
            vercel logs "$API_URL" --token="$VERCEL_TOKEN" --since=10m --level=error || true
            exit 1
          fi
          grep -q '"ok":true' /tmp/staging-health.json
          grep -q '"storage":"postgres"' /tmp/staging-health.json

      - name: Staff login (smoke)
        env:
          API_URL: ${{ steps.api.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          # Build the JSON body with python so special characters in the
          # credentials cannot break the request payload.
          body="$(STAFF_ADMIN_EMAIL="$STAFF_ADMIN_EMAIL" \
            STAFF_ADMIN_PASSWORD="$STAFF_ADMIN_PASSWORD" \
            python3 -c 'import json,os; print(json.dumps({"email": os.environ["STAFF_ADMIN_EMAIL"], "password": os.environ["STAFF_ADMIN_PASSWORD"]}))')"
          http_code="$(curl --show-error --silent \
            -o /tmp/staging-login.json \
            -w '%{http_code}' \
            -H "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET" \
            -H "content-type: application/json" \
            --data "$body" \
            "$API_URL/api/v1/auth/login")"
          echo "Login HTTP status: $http_code"
          if [ "$http_code" != "200" ]; then
            echo "Login response body:"
            cat /tmp/staging-login.json || true
            echo "Recent API runtime logs:"
            vercel logs "$API_URL" --token="$VERCEL_TOKEN" 2>&1 | tail -n 60 || true
            exit 1
          fi
          token="$(python3 -c 'import json; print(json.load(open("/tmp/staging-login.json"))["token"])')"
          if [ -z "$token" ]; then
            echo "Staff login failed: no token in response" >&2
            cat /tmp/staging-login.json || true
            exit 1
          fi
          echo "SMOKE_TOKEN=$token" >> "$GITHUB_ENV"
          echo "Staff login: ok"

      - name: Live web API proxy check
        env:
          WEB_URL: ${{ steps.web.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl --show-error --silent \
            -o /tmp/staging-proxy.json \
            -w '%{http_code}' \
            -H "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET" \
            -H "Authorization: Bearer $SMOKE_TOKEN" \
            "$WEB_URL/api/v1/cases")"
          echo "Proxy status: $status"
          cat /tmp/staging-proxy.json || true
          if [ "$status" != "200" ]; then
            echo "Same-origin web API proxy failed." >&2
            exit 1
          fi
          grep -q '^\[' /tmp/staging-proxy.json

      - name: Live web API create check
        env:
          WEB_URL: ${{ steps.web.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          payload='{"channel":"DIRECT","vehicle":{"year":2018,"make":"Jeep","model":"Wrangler","vin":"1C4HJXEG3JW224862"},"glass_request":{"glass_type":"WINDSHIELD"}}'
          status="$(curl --show-error --silent \
            -o /tmp/staging-create.json \
            -w '%{http_code}' \
            -X POST \
            -H "content-type: application/json" \
            -H "Authorization: Bearer $SMOKE_TOKEN" \
            -H "idempotency-key: staging-smoke-${GITHUB_SHA}" \
            -H "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET" \
            --data "$payload" \
            "$WEB_URL/api/v1/cases")"
          echo "Create status: $status"
          cat /tmp/staging-create.json || true
          if [ "$status" != "201" ] && [ "$status" != "200" ]; then
            echo "Same-origin web API create failed." >&2
            exit 1
          fi
          grep -q '"reference":"RRA-' /tmp/staging-create.json

      - name: Live browser smoke
        working-directory: apps/e2e
        env:
          WEB_BASE_URL: ${{ steps.web.outputs.url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ env.VERCEL_AUTOMATION_BYPASS_SECRET }}
          E2E_STAFF_EMAIL: ${{ secrets.STAFF_ADMIN_EMAIL }}
          E2E_STAFF_PASSWORD: ${{ secrets.STAFF_ADMIN_PASSWORD }}
        run: |
          npm install
          npx playwright install --with-deps chromium
          npm test

      - name: Record staging evidence
        env:
          API_URL: ${{ steps.api.outputs.url }}
          WEB_URL: ${{ steps.web.outputs.url }}
        shell: bash
        run: |
          cat > /tmp/staging-evidence.json <<EOF
          {
            "commit": "${GITHUB_SHA}",
            "api_url": "$API_URL",
            "web_url": "$WEB_URL",
            "health": "pass",
            "playwright": "pass"
          }
          EOF
          cat /tmp/staging-evidence.json
          echo "Staging commit: ${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: case-core-staging-evidence
          path: /tmp/staging-evidence.json

      - name: Record evidence on deployment issue
        env:
          GH_TOKEN: ${{ github.token }}
          API_URL: ${{ steps.api.outputs.url }}
          WEB_URL: ${{ steps.web.outputs.url }}
        shell: bash
        run: |
          gh issue comment 93 --repo "$GITHUB_REPOSITORY" --body "### Staging deployment passed

          Commit: \`${GITHUB_SHA}\`
          API: $API_URL
          Web: $WEB_URL

          Live API health: **PASS**
          Live Playwright: **PASS**

          This commit is eligible for production promotion."
