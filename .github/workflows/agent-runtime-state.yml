name: Agent runtime state

on:
  issue_comment:
    types:
      - created

permissions:
  contents: read
  issues: read

jobs:
  claim:
    if: github.event.issue.pull_request == null && contains(github.event.comment.body, '/agent start')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
      PROJECT_OWNER: '@me'
      PROJECT_NUMBER: '10'
      ISSUE_NUMBER: ${{ github.event.issue.number }}

    steps:
      - name: Checkout status writer
        uses: actions/checkout@v4

      - name: Mark claimed work In Progress
        shell: bash
        run: |
          chmod +x .github/scripts/project-status.sh
          .github/scripts/project-status.sh "$ISSUE_NUMBER" "In Progress"

  release:
    if: github.event.issue.pull_request == null && contains(github.event.comment.body, '/agent ready')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
      PROJECT_OWNER: '@me'
      PROJECT_NUMBER: '10'
      ISSUE_NUMBER: ${{ github.event.issue.number }}

    steps:
      - uses: actions/checkout@v4
      - name: Return work to Ready
        shell: bash
        run: |
          chmod +x .github/scripts/project-status.sh
          .github/scripts/project-status.sh "$ISSUE_NUMBER" "Ready"
