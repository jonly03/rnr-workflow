# fly.toml — mygrant-browser service
app = "rnr-mygrant-browser"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024

# Secrets (set by the shop owner, never in code):
#   fly secrets set MYGRANT_USERNAME=... MYGRANT_PASSWORD=... SERVICE_SECRET=...
